# Обновления зависимостей. Для действий Dependabot двигает хеш и комментарий с версией в той же строке.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Сборка презентации (pptxgenjs, sharp): в образ и пакет не входит, но запускается на машине команды.
  - package-ecosystem: npm
    directory: /submission/deck
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
