name: ci

on:
  push:
  pull_request:

# По умолчанию у токена нет прав; каждой задаче выдаётся только нужное.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip "setuptools>=83"
      - run: python -m pip install -e ".[dev,api,cedar,redis]"
      - run: python -m ruff check src tests scripts tools
      - run: python -m ruff format --check src tests scripts tools
      - run: python -m mypy
      - run: python -m pytest
      - run: python scripts/lint_claims.py
      - run: python scripts/check_links.py
      - name: known vulnerabilities in dependencies
        run: |
          python -m pip install "pip-audit>=2.10"
          python -m pip_audit --skip-editable
      - run: mandat demo
      - run: mandat eval --per-defect 6
      - run: mandat journal-verify var/demo/journal.jsonl
      - run: mandat monitor examples/events/poa_revoked.json --status-dir var/demo/status
      - run: mandat journal-proof var/demo/journal.jsonl --seq 1

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t mandat:ci .
      - name: container refuses to start without access settings
        run: |
          set +e
          docker run --rm mandat:ci
          test $? -eq 2

  # Пакет, SBOM и подписанное происхождение сборки (SLSA provenance) только для main.
  package:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip "build>=1.2" "cyclonedx-bom>=7"
      - run: python -m build
      - name: CycloneDX SBOM of the runtime environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP"/runtime/bin/pip install "$(ls dist/*.whl)[api]"
          cyclonedx-py environment "$RUNNER_TEMP"/runtime/bin/python --pyproject pyproject.toml --mc-type application --of JSON -o dist/mandat.cdx.json
      - name: build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"
      - name: SBOM attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*.whl"
          sbom-path: dist/mandat.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 30
