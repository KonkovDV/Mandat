# Релиз «Мандата»: колесо и sdist, SBOM CycloneDX, презентация и пакет аналитики. Каждый файл подписан
# Sigstore (*.sigstore.json), происхождение сборки SLSA лежит рядом (*.intoto.jsonl) и в аттестациях GitHub.
# Образ контейнера уходит в GHCR с собственной аттестацией. Запуск — вручную с номером версии из pyproject.toml.
name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия без «v», та же, что в pyproject.toml"
        required: true

# По умолчанию у токена нет прав; каждой задаче выдаётся только нужное.
permissions: {}

jobs:
  dist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: version matches pyproject.toml and CHANGELOG.md
        run: |
          python - <<'PY'
          import os, re, tomllib
          version = os.environ["VERSION"]
          declared = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          assert version == declared, f"версия {version!r}, а в pyproject.toml {declared!r}"
          assert re.search(rf"^## {re.escape(version)} — ", open("CHANGELOG.md", encoding="utf-8").read(), re.M), "нет раздела в CHANGELOG.md"
          PY
      - run: python -m pip install --require-hashes -r requirements/tools.lock
      - run: python -m pip install --require-hashes -r requirements/build.lock
      - run: python -m build --no-isolation
      - name: CycloneDX SBOM of the runtime environment
        run: |
          python -m venv "$RUNNER_TEMP/runtime"
          "$RUNNER_TEMP"/runtime/bin/pip install --require-hashes -r requirements/pip.lock
          "$RUNNER_TEMP"/runtime/bin/pip install --require-hashes -r requirements/runtime.lock
          "$RUNNER_TEMP"/runtime/bin/pip install --no-deps "$(ls dist/*.whl)"
          cyclonedx-py environment "$RUNNER_TEMP"/runtime/bin/python --pyproject pyproject.toml --mc-type application --of JSON -o "dist/mandat-$VERSION.cdx.json"
      - name: submission materials
        run: |
          cp submission/slides/Mandat_VTB.pdf "dist/Mandat_VTB-$VERSION.pdf"
          cp submission/analytics/out/Mandat_analytics_all.pdf "dist/Mandat_analytics-$VERSION.pdf"
          cp submission/analytics/out/Mandat_financial_model.xlsx "dist/Mandat_financial_model-$VERSION.xlsx"
      - name: build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: provenance next to the files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          # Конверт DSSE с выпиской SLSA — строкой JSON, полный пакет Sigstore с сертификатом — рядом.
          jq -c '.dsseEnvelope' "$BUNDLE" > "dist/mandat-$VERSION.intoto.jsonl"
          cp "$BUNDLE" "dist/mandat-$VERSION.provenance.sigstore.json"
      - name: Sigstore signatures
        uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: >-
            ./dist/*.whl
            ./dist/*.tar.gz
            ./dist/*.cdx.json
            ./dist/*.pdf
            ./dist/*.xlsx
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          retention-days: 30

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: image to GHCR
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ghcr.io/konkovdv/mandat:${{ inputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/KonkovDV/Mandat
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
      - name: image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/konkovdv/mandat
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    needs: [dist, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: release notes from CHANGELOG.md
        run: |
          python3 - <<'PY'
          import os, re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          version = os.environ["VERSION"]
          section = re.search(rf"^## {re.escape(version)} — .*?$(.*?)(?=^## |\Z)", text, re.M | re.S).group(1).strip()
          # Относительные ссылки CHANGELOG.md на странице релиза не открываются: ведём их на файлы этого тега.
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/blob/v{version}/"
          section = re.sub(r"\]\((?!https?://|#)([^)]+)\)", lambda m: f"]({base}{m.group(1)})", section)
          image = f"ghcr.io/konkovdv/mandat:{version}"
          check = (
              "\n\n## Проверка подписи\n\n"
              f"```\ngh attestation verify mandat-{version}-py3-none-any.whl --repo KonkovDV/Mandat\n"
              f"gh attestation verify oci://{image} --repo KonkovDV/Mandat\n```\n\n"
              "Подписи Sigstore каждого файла — в `*.sigstore.json` рядом с ним, происхождение SLSA — "
              f"в `mandat-{version}.intoto.jsonl`. Образ: `docker pull {image}`."
          )
          open("notes.md", "w", encoding="utf-8").write(section + check + "\n")
          PY
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --title "Мандат $VERSION" --notes-file notes.md
