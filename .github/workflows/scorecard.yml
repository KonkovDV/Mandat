# OpenSSF Scorecard: оценка цепочки поставки (закреплённые действия, права токена, опасные триггеры).
# Схема взята из рабочего процесса самого проекта ossf/scorecard.
name: scorecard

on:
  push:
    branches: [main]
  # Задача analysis — обязательная проверка защиты main, поэтому она идёт и на PR в main.
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Публикация в api.scorecard.dev — только с ветки по умолчанию; на PR — только локальный отчёт.
          publish_results: ${{ github.event_name != 'pull_request' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
