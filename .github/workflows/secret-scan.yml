name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 2"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: install gitleaks (release pinned by SHA-256)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar xzf "${tarball}" gitleaks
      - name: scan the full git history
        # Исключения — в .gitleaks.toml, у каждого объяснение. Найденное значение в лог не попадает (--redact).
        run: ./gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: every commit is authored by a code owner
        # Автор и коммитер каждого коммита — владелец кода из CODEOWNERS с адресом своей учётной записи GitHub.
        # Коммитер GitHub допустим: так выглядят слияния и правки, сделанные на github.com.
        # Трейлеров соавторства в сообщениях нет.
        run: |
          set -euo pipefail
          owners="$(grep -oE '@[A-Za-z0-9-]+' .github/CODEOWNERS | tr -d '@' | sort -u | paste -sd'|' -)"
          allowed="^[0-9]+\+(${owners})@users\.noreply\.github\.com$"
          failed=0
          while read -r sha author committer; do
            if [ "$committer" = "noreply@github.com" ]; then continue; fi
            if [[ "$author" =~ $allowed && "$committer" =~ $allowed ]]; then continue; fi
            echo "::error::коммит ${sha}: автор ${author}, коммитер ${committer}. Нужен владелец кода из CODEOWNERS: задайте user.name и user.email своей учётной записи и перепишите коммиты ветки"
            failed=1
          done < <(git log --format='%H %ae %ce')
          trailer='co-authored'
          if git log --format='%B' | grep -qiE "^${trailer}-by:"; then
            echo "::error::в сообщениях коммитов есть трейлеры соавторства"
            failed=1
          fi
          exit "$failed"
