[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mandat"
version = "0.3.0"
description = "Мандат: доказательная проверка полномочий представителей юрлиц для банка (on-prem)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Konkov Dmitrij" }]
keywords = ["МЧД", "доверенность", "полномочия", "KYB", "банк", "on-prem"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Russian",
]
# Ядро держим маленьким: разбор XML с защитой и подпись удостоверений.
dependencies = [
  "defusedxml>=0.7.1",
  "cryptography>=45",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Общее хранилище API для нескольких машин (MANDAT_API_STORE=redis://…).
redis = ["redis>=5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "fastapi>=0.110", "fakeredis[lua]>=2.20", "redis>=5", "pytest-cov>=5", "hypothesis>=6.100", "asn1crypto>=1.5", "tuf>=6", "jsonschema>=4.23"]
# Независимая проверка правил передоверия на Cedar (tests/test_cedar.py).
# Версия закреплена точно: дифференциальный тест сверяет семантику Cedar, а она меняется между версиями.
cedar = ["cedarpy==4.12.1"]
# Ключ подписи удостоверений вне файла (docs/KEYS.md): HSM по PKCS#11 и AWS KMS. Vault Transit — без extra.
pkcs11 = ["python-pkcs11>=0.7"]
aws = ["boto3>=1.35"]
# Внешний якорь журнала по RFC 3161 (audit/anchor.py): разбор и проверка метки времени.
tsa = ["asn1crypto>=1.5"]
# TrustedRoot и SigningConfig Sigstore через TUF (audit/trust.py); без extra — офлайн из заданных файлов.
tuf = ["tuf>=6"]

[project.scripts]
mandat = "mandat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mandat = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -rs печатает причины пропусков. -q здесь не ставим: вместе с `pytest --co -q` он давал -qq и пустой вывод.
addopts = "-rs"

[tool.coverage.run]
source = ["mandat"]
branch = false

[tool.coverage.report]
# Текущее покрытие 95 %; порог чуть ниже, чтобы шум не ронял CI, а заметное падение ронял.
fail_under = 93
show_missing = false

[tool.mypy]
python_version = "3.11"
files = ["src"]
# R2: строгий режим для всего пакета (ruff и mypy --strict без исключений).
strict = true

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*", "cedarpy", "uvicorn", "pkcs11", "boto3"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["var", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S603", "S607"]
"src/mandat/report/html.py" = ["E501"]

# Точечное мутационное тестирование ядра правил (ручной запуск, docs/testing/MUTATION.md).
[tool.mutmut]
source_paths = ["src/mandat"]
only_mutate = ["src/mandat/rules/checks.py"]
also_copy = ["docs", "examples", "scripts", "policies", "evidence.json", "README.md", "LIMITS.md", "CHANGELOG.md", "SECURITY.md", "requirements", ".github", "pyproject.toml"]
pytest_add_cli_args = ["-q", "-x", "-p", "no:randomly", "--no-cov", "--deselect", "tests/test_regressions.py::test_evidence_matches_current_engine"]
