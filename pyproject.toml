[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mandat"
version = "0.2.3"
description = "Мандат: доказательная проверка полномочий представителей юрлиц для банка (on-prem)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "Konkov Dmitrij" }]
keywords = ["МЧД", "доверенность", "полномочия", "KYB", "банк", "on-prem"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Natural Language :: Russian",
]
# Ядро держим маленьким: разбор XML с защитой и подпись удостоверений.
dependencies = [
  "defusedxml>=0.7.1",
  "cryptography>=42",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
# Общее хранилище API для нескольких машин (MANDAT_API_STORE=redis://…).
redis = ["redis>=5"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "httpx>=0.27", "fastapi>=0.110", "fakeredis[lua]>=2.20", "redis>=5"]
# Независимая проверка правил передоверия на Cedar (tests/test_cedar.py).
cedar = ["cedarpy>=4.1"]

[project.scripts]
mandat = "mandat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mandat = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src"]

[[tool.mypy.overrides]]
module = ["defusedxml", "defusedxml.*", "cedarpy", "uvicorn"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["var", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S603", "S607"]
"src/mandat/report/html.py" = ["E501"]
