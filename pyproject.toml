[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mandat"
version = "0.2.3"
description = "Мандат: доказательная проверка полномочий представителей юрлиц для банка (on-prem)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Konkov Dmitrij" }]
keywords = ["МЧД", "доверенность", "полномочия", "KYB", "банк", "on-prem"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: Russian",
]
# Ядро держим маленьким: разбор XML с защитой и подпись удостоверений.
dependencies = [
  "defusedxml>=0.7.1",
  "cryptography>=42",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27", "fastapi>=0.110"]
# Независимая проверка правил передоверия на Cedar (tests/test_cedar.py).
cedar = ["cedarpy>=4.1"]

[project.scripts]
mandat = "mandat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mandat = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["var", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"scripts/*" = ["S603", "S607"]
"src/mandat/report/html.py" = ["E501"]
